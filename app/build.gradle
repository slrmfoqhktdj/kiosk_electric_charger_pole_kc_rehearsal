plugins {
    id 'com.android.application'
}

android {
    signingConfigs {
        debug {
            storeFile file('C:\\Users\\GRACE\\Desktop\\인엽\\어플 관리\\android\\kiosk_electric_charger\\keystore\\dingchang.jks')
            keyAlias 'dingchang'
            storePassword 'ztl610'
            keyPassword 'ztl610'
        }
    }

    namespace 'com.example.kiosk_electric_charger_pole_kc_rehearsal'
    compileSdk 33

    defaultConfig {
        applicationId 'com.example.kiosk_electric_charger_pole_kc_rehearsal'
        minSdk 24
        targetSdk 33
        versionCode 7
        versionName "1.1.2"

        //계측 테스트
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true               //NoClassDefFoundError 오류 해결법
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }

//    sourceSets { main { jni.srcDirs = ['src/main/jni', 'src/main/jniLibs/'] } }

}

dependencies {
//    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'junit:junit:4.12'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'

    //Glide 이미지변환
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'

    //LiveData
    implementation "android.arch.lifecycle:extensions:1.1.1"
    implementation "android.arch.lifecycle:viewmodel:1.1.1"

    //websocket
    implementation("com.squareup.okhttp3:okhttp:4.9.3")

    //ocpp
    implementation ('com.github.ChargeTimeEU:Java-OCA-OCPP:1.1'){
        exclude group: 'com.github.ChargeTimeEU.Java-OCA-OCPP',module:'v2_0'
//        exclude group: 'com.github.ChargeTimeEU.Java-OCA-OCPP',module:'v1_6'
        exclude group: 'com.github.ChargeTimeEU.Java-OCA-OCPP',module:'v2_0-test'
//        exclude group: 'com.github.ChargeTimeEU.Java-OCA-OCPP',module:'v1_6-test'
    }

    //log 기록
//    implementation 'org.slf4j:slf4j-api:2.0.7'
//    implementation 'com.github.tony19:logback-android:3.0.0'

//    implementation 'com.jakewharton.timber:timber:5.0.1'

    implementation 'com.orhanobut:logger:2.2.0'

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"        //NoClassDefFoundError 오류 해결법


}